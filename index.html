<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f18">
<title>Trust Yourself</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="stage"></canvas>

<div class="steps hide" id="steps"><i id="d1"></i><i id="d2"></i><i id="d3"></i></div>
<div class="prefs" id="prefs">
  <button class="pref" id="pSound">sound</button>
  <button class="pref" id="pBuzz">buzz</button>
</div>

<!-- intro -->
<section class="screen on fade" id="s-intro">
  <h1>Exit the Loop</h1>
  <p class="note">Follow your breath, then answer a few questions to choose your next step.</p>
  <button class="go" id="begin">Begin</button>
</section>

<!-- breath -->
<section class="screen" id="s-breath">
  <p class="counter" id="round"></p>
  <p class="phase" id="phase">Press and hold</p>
  <p class="note" id="breathNote">Hold anywhere on the screen to start.</p>
  <p class="hint" id="breathHint"></p>
  <button class="ghost" id="breathSkip">Skip breathing</button>
</section>

<!-- quiz -->
<section class="screen" id="s-quiz">
  <p class="say" id="question"></p>
  <div class="opts" id="opts"></div>
  <p class="hint" id="quizHint">Pick the one that's closest. Close is enough.</p>
</section>

<!-- anchor -->
<section class="screen" id="s-anchor">
  <p class="say" id="anchorSay">Choose a thought to keep</p>
  <div class="phrase" id="thoughtCard">
    <button class="thought" id="phrase" type="button" aria-pressed="false"></button>
    <button class="thoughtEdit" id="editBtn" type="button" aria-label="Edit thought">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 5 5-13 13H3v-5Z"/><path d="m14 5 5 5"/></svg>
      <span>Edit</span>
    </button>
  </div>
  <label id="ownWrap"><textarea id="own" rows="3" maxlength="120" enterkeyhint="done" placeholder="Write it in your own words" autocomplete="off"></textarea></label>
  <div class="acts">
    <button class="go" id="keepBtn">Keep this</button>
    <button class="ghost" id="skipBtn">Skip</button>
  </div>
</section>

<!-- final -->
<section class="screen" id="s-final">
  <p class="say" id="finalPhrase"></p>
  <button class="ghost" id="thoughtBtn">Choose a thought</button>
  <button class="ghost" id="again">Start again</button>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
